# ─────────────────────────────────────────────────────────────────────────────
# 24Boda — Monorepo Root
#
# This is NOT a runnable Flutter app. It is the workspace root for the
# 24Boda monorepo. The actual apps live in:
#   apps/customer_app   — Flutter app for customers
#   apps/rider_app      — Flutter app for riders
#
# Shared packages live in:
#   packages/core_models        — Domain entities (pure Dart)
#   packages/theme              — Design system (colors, typography, components)
#   packages/firebase_services  — Firestore, Auth, Storage abstractions
#   packages/maps               — Google Maps integration
#   packages/notifications      — Firebase Cloud Messaging
#   packages/utils              — Validators, formatters, helpers (pure Dart)
#
# To run an app:
#   cd apps/customer_app && flutter run
#   cd apps/rider_app    && flutter run
# ─────────────────────────────────────────────────────────────────────────────

name: _24boda_workspace
description: "24Boda monorepo workspace root. Not a runnable app."
publish_to: 'none'

environment:
  sdk: ^3.12.2
