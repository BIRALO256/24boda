name: theme
description: "24Boda design system — colors, typography, spacing, and ThemeData."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # DM Sans font — delivered via google_fonts, no manual asset management.
  # google_fonts caches fonts on first use, works offline after that.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
