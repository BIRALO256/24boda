# ─────────────────────────────────────────────────────────────────────────────
# 24Boda — Shared Lint Rules (applied across all apps and packages)
# Note: No 'include' here — the root workspace is not a Flutter package.
# Each app and package includes flutter_lints via their own pubspec.yaml.
# ─────────────────────────────────────────────────────────────────────────────

analyzer:
  errors:
    # Treat missing returns as errors, not warnings
    missing_return: error
    # Dead code is always a bug in this codebase
    dead_code: error

linter:
  rules:
    # ── Style ──────────────────────────────────────────────────────────────
    prefer_single_quotes: true
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true

    # ── Clean architecture enforcement ─────────────────────────────────────
    always_use_package_imports: true

    # ── Safety ─────────────────────────────────────────────────────────────
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
