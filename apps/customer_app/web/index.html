<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="24Boda Customer App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API for web.
       Replace YOUR_GOOGLE_MAPS_API_KEY_HERE with your actual key.
       Restrict this key in Google Cloud Console to:
       Application restrictions → HTTP referrers → localhost/* (dev)
       Add your production domain before launch. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBuM_jWsVdsVGkdiyzeZS3es3Qb2PCj9ck"></script>
</head>
<body>
  <!-- Invisible reCAPTCHA anchor for Firebase Phone Auth on web.
       Must exist in the DOM before signInWithPhoneNumber is called.
       The 'invisible' size means no challenge is shown to the user
       unless Google's risk engine flags the request as suspicious. -->
  <div id="recaptcha-container"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
